input: ./src
output: .retype
url: docs.doughmination.gay

locale: en

branding:
  title: Doughmination Docs
  logo: /media/favicon.png
  logoAlign: left
  colors:
    label:
      text: "#0f2540"
      background: "#f596aa"

links:
  - text: Home
    link: index.md
    icon: home

editor:
  enabled: false

favicon: /media/favicon.png

generator:
  recase: all

markdown:
  lineBreaks: soft

meta:
  title: " | Doughmination Docs"

search:
  hotkeys:
    - "/"
  maxResults: 20
  minChars: 2
  mode: full
  noResultsFoundMsg: "No results"
  placeholder: Search

start:
  open: false

snippets:
  lineNumbers:
    - js
    - none

templating:
  enabled: true
  liquid: false

footer:
  copyright: "&copy; 2026 Clove Twilight - All Rights Reserved."
  links:
    - text: GitHub
      link: https://github.com/doughmination
    - text: Discord
      link: https://discord.gg/N8gCjS294R
    - text: Matrix
      link: https://matrix.to/#/#doughmination:matrix.org

backlinks:
  enabled: false

#theme:
#  base:
#    base-color: "#d64f9b"
#    base-bg: "#fce7f3"

#  dark:
#    base-color: "#f5a6d0"
#    base-bg: "#3b2633"