<!--
  Force dark mode site-wide.

  Retype's own bootstrap decides the colour scheme from, in order:
    1. localStorage["retype_scheme"]  ("dark" | "light"; absent means "system")
    2. the `dark` / `light` class already on <html>
    3. the visitor's prefers-color-scheme

  Pinning (1) and (2) to dark makes every later check agree, so the page
  never renders light even for a moment. The `scheme.mode` project setting
  does the same thing natively, but it is Retype Pro only.
-->
<script data-cfasync="false">
  (function () {
    try { localStorage.setItem("retype_scheme", "dark"); } catch (e) {}
    var cl = document.documentElement.classList;
    cl.remove("light");
    cl.add("dark");
  })();
</script>

<style>
  /* Hide the light/dark switch: there is nothing left for it to switch to. */
  [aria-label="Change theme"],
  [title="Change theme"],
  .scheme-menu-item,
  .scheme-menu-item-text {
    display: none !important;
  }
</style>

<!-- JPCL palette, matching jpcl-lang/web. Retype's own `theme:` setting is Pro only. -->
<link rel="stylesheet" href="/assets/css/jpcl-theme.css">
